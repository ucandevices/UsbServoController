# Packages the host-side MCP server (tools/servo_mcp.py) for PyPI, so MCP
# clients can run it with `uvx ucan-servo-mcp`. The other tools keep running
# straight from tools/ as before.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucan-servo-mcp"
version = "0.4.0"
description = "MCP server for the open-hardware USB-C 12-channel servo controller (Pololu Maestro compatible)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "uCanDevices" }]
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "mcp>=2"]
keywords = ["mcp", "servo", "servo-controller", "robotics", "pololu-maestro", "usb-c"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://ucandevices.github.io/servo.html"
Source = "https://github.com/ucandevices/UsbServoController"
Buy = "https://www.tindie.com/products/lll7/usb-servo-controller-12-channels-usb-c/"

[project.scripts]
ucan-servo-mcp = "servo_mcp:main"

[tool.setuptools]
package-dir = { "" = "tools" }
py-modules = ["servo_mcp", "servoconfig", "servoscript", "usc"]
